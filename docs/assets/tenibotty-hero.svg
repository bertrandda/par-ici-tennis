<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Tenibotty — Moins de refresh. Plus de revers.</title>
  <desc id="desc">Bannière sur fond vert profond, texte crème et orange, terrain de tennis terre battue et balle jaune. Tes clubs, tes horaires, ton prochain échange.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10251f"/><stop offset="1" stop-color="#20382b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f69d6a" stop-opacity=".15"/><stop offset="1" stop-color="#f69d6a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e2e6c9" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <circle cx="1020" cy="220" r="320" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="52" width="136" height="30" rx="15" fill="#ffa874"/>
    <text x="132" y="72" text-anchor="middle" fill="#203127" font-size="12" font-weight="700" letter-spacing="2">PARIS · TENNIS</text>
    <text x="64" y="154" fill="#fcf5df" font-size="58" font-weight="800" letter-spacing="-2">tenibotty<tspan fill="#ffa874">.</tspan></text>
    <text x="64" y="229" fill="#fcf5df" font-size="42" font-weight="700" letter-spacing="-1">Moins de refresh.</text>
    <text x="64" y="280" fill="#ffa874" font-size="42" font-weight="700" letter-spacing="-1">Plus de revers.</text>
    <text x="64" y="331" fill="#c1cfbf" font-size="19">Tes clubs. Tes horaires. Ton prochain échange.</text>
    <path d="M64 378H620" stroke="#c1cfbf" stroke-opacity=".2"/>
    <text x="64" y="414" fill="#e3ead9" font-size="13" letter-spacing="2">REPÉRER</text>
    <text x="190" y="414" fill="#ffa874" font-size="15">→</text>
    <text x="228" y="414" fill="#e3ead9" font-size="13" letter-spacing="2">PROGRAMMER</text>
    <text x="404" y="414" fill="#ffa874" font-size="15">→</text>
    <text x="442" y="414" fill="#e3ead9" font-size="13" letter-spacing="2">JOUER</text>
  </g>
  <g transform="translate(811 55) rotate(9 145 184)">
    <rect x="-20" y="-20" width="330" height="408" rx="24" fill="#ffb07c" fill-opacity=".04" stroke="#ffb07c" stroke-opacity=".2"/>
    <rect width="290" height="368" rx="3" fill="#a74d35" stroke="#fff0d9" stroke-width="2"/>
    <path d="M32 0V368M258 0V368M32 94H258M32 274H258M145 94V274M145 0V7M145 361V368" stroke="#fff0d9" stroke-width="2" fill="none"/>
    <path d="M-12 184H302" stroke="#fff0d9" stroke-width="3" stroke-dasharray="3 4"/>
    <path d="M83 319Q231 235 209 87" fill="none" stroke="#dfed7a" stroke-width="2" stroke-dasharray="7 9" opacity=".65"/>
    <circle cx="209" cy="87" r="26" fill="#e3f588" fill-opacity=".12"/>
    <circle cx="209" cy="87" r="12" fill="#e3f588"/>
    <path d="M202 78Q213 88 201 95M217 79Q206 86 219 93" stroke="#7c9438" stroke-width="1.4" fill="none"/>
    <circle cx="83" cy="319" r="6" fill="#e3f588" fill-opacity=".5"/>
